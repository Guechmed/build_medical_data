<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Validator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f4f0;
  --white: #ffffff;
  --ink: #1a1a1a;
  --ink2: #555;
  --ink3: #999;
  --border: #e0ddd8;
  --border2: #ccc;
  --green: #1a7a3c;
  --green-bg: #eaf5ee;
  --green-border: #b3dfc0;
  --red: #b01c1c;
  --red-bg: #fdf0f0;
  --red-border: #f0b3b3;
  --yellow: #7a5a00;
  --yellow-bg: #fdf8e8;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

/* ── UPLOAD SCREEN ─────────────────────────────────────────── */
#upload-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 24px;
  padding: 40px 20px;
}

.upload-title {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.5px;
}
.upload-sub {
  font-size: 14px;
  color: var(--ink3);
  text-align: center;
  max-width: 400px;
  line-height: 1.6;
}

.drop-zone {
  width: 380px;
  max-width: 100%;
  border: 2px dashed var(--border2);
  border-radius: 12px;
  padding: 48px 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  background: var(--white);
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--ink);
  background: #fafaf8;
}
.drop-icon { font-size: 36px; margin-bottom: 12px; }
.drop-label {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink2);
  margin-bottom: 6px;
}
.drop-hint { font-size: 12px; color: var(--ink3); }

#file-input { display: none; }

.format-note {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink3);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 16px;
  max-width: 380px;
  line-height: 1.7;
}

/* ── MAIN APP ─────────────────────────────────────────────── */
#app { display: none; }

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.app-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.progress-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink3);
}

.progress-bar-wrap {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 2px;
  transition: width 0.3s ease;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.score-pill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid;
}
.score-pill.right { color: var(--green); border-color: var(--green-border); background: var(--green-bg); }
.score-pill.wrong { color: var(--red); border-color: var(--red-border); background: var(--red-bg); }

.export-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--white);
  cursor: pointer;
  color: var(--ink2);
  transition: all 0.12s;
}
.export-btn:hover { border-color: var(--ink); color: var(--ink); }

.new-btn {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--white);
  cursor: pointer;
  color: var(--ink2);
  transition: all 0.12s;
}
.new-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ── QUESTION AREA ─────────────────────────────────────────── */
.content {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

.q-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.nav-btn {
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid var(--border2);
  border-radius: 6px;
  background: var(--white);
  cursor: pointer;
  color: var(--ink2);
  transition: all 0.12s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

.q-counter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink3);
  flex: 1;
  text-align: center;
}

/* Question box */
.q-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 20px;
}

.q-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}

.q-text {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.5;
}

/* Option cards */
.option-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.option-card.judged-right { border-color: var(--green-border); background: var(--green-bg); }
.option-card.judged-wrong { border-color: var(--red-border); background: var(--red-bg); }

.option-top {
  padding: 16px 20px 14px;
}

.option-letter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.option-letter {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--ink3);
}

.correct-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--green);
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  padding: 2px 7px;
  border-radius: 4px;
}
.wrong-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--red);
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  padding: 2px 7px;
  border-radius: 4px;
}
.verdict-tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid;
  margin-left: auto;
}
.verdict-tag.GROUNDED { color: var(--green); border-color: var(--green-border); background: var(--green-bg); }
.verdict-tag.UNCERTAIN { color: var(--yellow); border-color: #e0cc80; background: var(--yellow-bg); }
.verdict-tag.HALLUCINATION_RISK { color: var(--red); border-color: var(--red-border); background: var(--red-bg); }
.verdict-tag.NOT_RETRIEVED { color: var(--ink3); border-color: var(--border); background: var(--bg); }

.option-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.55;
  margin-bottom: 12px;
}

/* Snippet */
.snippet-area {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.snippet-source {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.snippet-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink2);
  line-height: 1.65;
  white-space: pre-wrap;
}

.no-snippet {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink3);
  padding: 10px 0 4px;
  font-style: italic;
}

/* Judge buttons */
.judge-row {
  display: flex;
  gap: 10px;
  padding: 0 20px 16px;
}

.judge-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1.5px solid;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: 0.2px;
}

.judge-btn.right-btn {
  color: var(--green);
  border-color: var(--green-border);
  background: var(--green-bg);
}
.judge-btn.right-btn:hover, .judge-btn.right-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}

.judge-btn.wrong-btn {
  color: var(--red);
  border-color: var(--red-border);
  background: var(--red-bg);
}
.judge-btn.wrong-btn:hover, .judge-btn.wrong-btn.active {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

/* Done screen */
#done-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 16px;
  text-align: center;
  padding: 40px 20px;
}
.done-title {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 500;
}
.done-stats {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.8;
}
.done-export {
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 24px;
  border-radius: 8px;
  border: 1.5px solid var(--ink);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.15s;
}
.done-export:hover { opacity: 0.8; }
</style>
</head>
<body>

<!-- UPLOAD SCREEN -->
<div id="upload-screen">
  <div class="upload-title">RAG Validator</div>
  <div class="upload-sub">Upload your RAG results JSON file to start validating evidence snippets.</div>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-icon">📂</div>
    <div class="drop-label">Click or drag & drop</div>
    <div class="drop-hint">full_result_*.json</div>
  </div>
  <input type="file" id="file-input" accept=".json">

  <div class="format-note">
    Expected format: array of objects with<br>
    <code>id, question, answers[]</code><br>
    Each answer: <code>answer, snippet, verdict, best_source</code>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="app-title">RAG Validator</span>
      <span class="progress-text" id="progress-text">0 / 0</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="score-pill right" id="score-right">✓ 0</span>
      <span class="score-pill wrong" id="score-wrong">✗ 0</span>
      <button class="export-btn" onclick="exportResults()">Export JSON</button>
      <button class="new-btn" onclick="resetToUpload()">New file</button>
    </div>
  </div>

  <div class="content">
    <div class="q-nav">
      <button class="nav-btn" id="btn-prev" onclick="goQ(-1)">← Prev</button>
      <span class="q-counter" id="q-counter"></span>
      <button class="nav-btn" id="btn-next" onclick="goQ(1)">Next →</button>
    </div>

    <div class="q-box">
      <div class="q-tag" id="q-tag"></div>
      <div class="q-text" id="q-text"></div>
    </div>

    <div id="options-container"></div>

    <div id="done-screen">
      <div class="done-title">All done ✓</div>
      <div class="done-stats" id="done-stats"></div>
      <button class="done-export" onclick="exportResults()">Download results JSON</button>
    </div>
  </div>
</div>

<script>
let questions = [];   // parsed from JSON
let judgments = {};   // { "qid__answerIdx": 1 | 0 }
let currentQ = 0;

// ── FILE UPLOAD ──────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) readFile(file);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) readFile(fileInput.files[0]);
});

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = JSON.parse(e.target.result);
      questions = raw;
      // Try to load saved judgments by file contents hash (just use length as loose key)
      const key = 'rag_j_' + questions.length + '_' + (questions[0]?.id || '');
      try { const saved = localStorage.getItem(key); if (saved) judgments = JSON.parse(saved); } catch {}
      window._storageKey = key;
      currentQ = 0;
      startApp();
    } catch(err) {
      alert('Could not parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function startApp() {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderQuestion();
  updateTopbar();
}

function resetToUpload() {
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  questions = [];
  judgments = {};
  currentQ = 0;
  fileInput.value = '';
}

// ── NAVIGATION ────────────────────────────────────────────────
function goQ(delta) {
  currentQ = Math.max(0, Math.min(questions.length - 1, currentQ + delta));
  renderQuestion();
  updateTopbar();
  window.scrollTo(0, 0);
}

// ── RENDER ────────────────────────────────────────────────────
function renderQuestion() {
  const q = questions[currentQ];
  if (!q) return;

  document.getElementById('q-tag').textContent = `Question ${currentQ + 1} of ${questions.length}  ·  ID ${q.id}`;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('q-counter').textContent = `${currentQ + 1} / ${questions.length}`;
  document.getElementById('btn-prev').disabled = currentQ === 0;
  document.getElementById('btn-next').disabled = currentQ === questions.length - 1;

  const answers = q.answers || [];
  const container = document.getElementById('options-container');
  container.innerHTML = '';

  answers.forEach((ans, i) => {
    const key = `${q.id}__${i}`;
    const judgment = judgments[key]; // 1, 0, or undefined
    const letter = String.fromCharCode(65 + i);
    const hasSnippet = ans.snippet && ans.snippet.trim();
    const source = ans.best_source ? ans.best_source.replace('_chunks.json','').replace(/_/g,' ') : null;

    const card = document.createElement('div');
    card.className = 'option-card' + (judgment === 1 ? ' judged-right' : judgment === 0 ? ' judged-wrong' : '');
    card.id = 'card-' + key;

    const verdictLabel = {
      'GROUNDED': 'GROUNDED',
      'UNCERTAIN': 'UNCERTAIN',
      'HALLUCINATION_RISK': 'HALLUCINATION',
      'NOT_RETRIEVED': 'NOT RETRIEVED',
    }[ans.verdict] || ans.verdict;

    card.innerHTML = `
      <div class="option-top">
        <div class="option-letter-row">
          <div class="option-letter">${letter}</div>
          <span class="verdict-tag ${ans.verdict}">${verdictLabel}</span>
        </div>
        <div class="option-text">${ans.answer}</div>
        ${hasSnippet ? `
          <div class="snippet-area">
            ${source ? `<div class="snippet-source">📚 ${source}</div>` : ''}
            <div class="snippet-text">${ans.snippet.trim()}</div>
          </div>
        ` : `<div class="no-snippet">No snippet retrieved</div>`}
      </div>
      <div class="judge-row">
        <button class="judge-btn right-btn${judgment === 1 ? ' active' : ''}" onclick="judge('${key}', 1)">
          ✓ Right
        </button>
        <button class="judge-btn wrong-btn${judgment === 0 ? ' active' : ''}" onclick="judge('${key}', 0)">
          ✗ Wrong
        </button>
      </div>
    `;

    container.appendChild(card);
  });
}

// ── JUDGMENT ──────────────────────────────────────────────────
function judge(key, value) {
  // Toggle off if same
  if (judgments[key] === value) {
    delete judgments[key];
  } else {
    judgments[key] = value;
  }
  saveJudgments();
  updateTopbar();

  // Re-render just this card
  const q = questions[currentQ];
  const [qid, iStr] = key.split('__');
  const i = parseInt(iStr);
  const ans = q.answers[i];
  const judgment = judgments[key];
  const card = document.getElementById('card-' + key);
  if (!card) return;

  card.className = 'option-card' + (judgment === 1 ? ' judged-right' : judgment === 0 ? ' judged-wrong' : '');
  const rightBtn = card.querySelector('.right-btn');
  const wrongBtn = card.querySelector('.wrong-btn');
  rightBtn.className = 'judge-btn right-btn' + (judgment === 1 ? ' active' : '');
  wrongBtn.className = 'judge-btn wrong-btn' + (judgment === 0 ? ' active' : '');
}

function saveJudgments() {
  try {
    if (window._storageKey) localStorage.setItem(window._storageKey, JSON.stringify(judgments));
  } catch(e) {}
}

// ── TOPBAR ────────────────────────────────────────────────────
function updateTopbar() {
  const vals = Object.values(judgments);
  const rights = vals.filter(v => v === 1).length;
  const wrongs = vals.filter(v => v === 0).length;
  const total = questions.reduce((s, q) => s + (q.answers?.length || 0), 0);
  const done = vals.length;

  document.getElementById('score-right').textContent = `✓ ${rights}`;
  document.getElementById('score-wrong').textContent = `✗ ${wrongs}`;
  document.getElementById('progress-text').textContent = `${done} / ${total} reviewed`;
  document.getElementById('progress-bar').style.width = total > 0 ? (done / total * 100) + '%' : '0%';
}

// ── EXPORT ────────────────────────────────────────────────────
function exportResults() {
  const out = questions.map(q => ({
    id: q.id,
    question: q.question,
    answers: (q.answers || []).map((ans, i) => {
      const key = `${q.id}__${i}`;
      return {
        answer: ans.answer,
        verdict: ans.verdict,
        score: ans.score,
        best_source: ans.best_source,
        snippet: ans.snippet,
        judgment: judgments[key] !== undefined ? judgments[key] : null,
      };
    }),
  }));

  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rag_judgments.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
